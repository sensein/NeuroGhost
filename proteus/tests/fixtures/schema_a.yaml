# Toy schema A: a spectroscopic survey catalog
schema_id: desi_cat
elements:
  - id: z_spec
    name: z_spec
    aliases: [spec_z]
    definition: Spectroscopic redshift of the target.
    unit: ""
    exact_anchors: ["ivoa:src.redshift"]
  - id: ra
    name: ra
    definition: Right ascension, ICRS.
    unit: deg
    exact_anchors: ["ivoa:pos.eq.ra"]
  - id: dec
    name: dec
    definition: Declination, ICRS.
    unit: deg
    exact_anchors: ["ivoa:pos.eq.dec"]
  - id: obs_wavelength
    name: obs_wavelength
    definition: Observed wavelength of the primary spectral feature.
    unit: AA
  - id: exposure_time
    name: exposure_time
    aliases: [exptime]
    definition: Total exposure time.
    unit: s
  - id: r_mag
    name: r_mag
    definition: Apparent magnitude in the r band.
    unit: mag
