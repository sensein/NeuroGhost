name: Schema Submission

on:
  issues:
    types: [opened]

jobs:
  ingest:
    if: startsWith(github.event.issue.title, 'schema-submission:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -----------------------------------------------------------------------
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-minilm-v2
          restore-keys: hf-

      # Embeddings cache keyed on all schemas — new schema busts the cache and
      # forces a recompute, unchanged schemas reuse their cached vectors.
      - name: Cache embeddings
        uses: actions/cache@v4
        with:
          path: data/embeddings.parquet
          key: embeddings-${{ hashFiles('registry_schemas/*.yml') }}-${{ github.run_id }}
          restore-keys: embeddings-${{ hashFiles('registry_schemas/*.yml') }}-
                        embeddings-

      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: pip install -r requirements.txt

      # -----------------------------------------------------------------------
      - name: Parse issue metadata
        id: meta
        env:
          ISSUE_BODY:   ${{ github.event.issue.body }}
          ISSUE_TITLE:  ${{ github.event.issue.title }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          python3 - << 'PYEOF'
          import os, re

          body  = os.environ.get("ISSUE_BODY", "") or ""
          title = os.environ.get("ISSUE_TITLE", "") or ""

          def field(label):
              m = re.search(r'^###\s+' + re.escape(label) + r'\s*\n(.*?)(?=\n###\s|\Z)',
                            body, re.DOTALL | re.MULTILINE)
              if not m:
                  return ""
              v = m.group(1).strip()
              return "" if v == "_No response_" else v

          # Name: prefer the issue-form "Schema name" field; fall back to the
          # title suffix (the web-UI prefill path: "schema-submission: <name>").
          name = field("Schema name") or title.split("schema-submission:", 1)[-1]
          name = re.sub(r'[^a-z0-9]+', '-', name.strip().lower()).strip('-') or "schema"

          bump = "major" if "breaking" in os.environ.get("ISSUE_LABELS", "").lower() else "minor"

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"schema_name={name}\n")
              out.write(f"bump={bump}\n")
          print("schema_name:", name, "| bump:", bump)
          PYEOF

      # -----------------------------------------------------------------------
      # Write the submitted schema to registry_schemas/{name}.yml (+ an optional
      # {name}_source.yaml sidecar of bundle/source metadata) so pipeline.py picks
      # them up. Reads the issue-form fields, with the web-UI prefill body as a
      # fallback.
      - name: Extract schema + metadata
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          SCHEMA_NAME: ${{ steps.meta.outputs.schema_name }}
        run: |
          python3 - << 'PYEOF'
          import os, re, sys, json
          import yaml

          body = os.environ.get("ISSUE_BODY", "") or ""
          name = os.environ["SCHEMA_NAME"]

          def field(label):
              m = re.search(r'^###\s+' + re.escape(label) + r'\s*\n(.*?)(?=\n###\s|\Z)',
                            body, re.DOTALL | re.MULTILINE)
              if not m:
                  return ""
              v = m.group(1).strip()
              return "" if v == "_No response_" else v

          # Schema content: the fenced code block (the issue-form textarea renders
          # as ```yaml; the web-UI prefill fences with the detected language).
          fenced = re.search(r'```([\w-]*)\s*\n(.*?)```', body, re.DOTALL)
          if fenced:
              fence_lang = (fenced.group(1) or "").lower()
              content = fenced.group(2).strip()
          else:
              fence_lang, content = "", body.strip()

          # Format: prefer the "Format" dropdown — the form's textarea always
          # renders as ```yaml, so the fence can't distinguish JSON from LinkML;
          # fall back to the fence language for the web-UI prefill path.
          fmt = field("Format").lower()
          json_langs = {"json", "json-schema", "jsonschema"}
          is_json = ("json" in fmt) if fmt else (fence_lang in json_langs)

          os.makedirs("registry_schemas", exist_ok=True)
          out_path = f"registry_schemas/{name}.yml"

          if is_json:
              print("Format: JSON Schema — converting…")
              sys.path.insert(0, ".")
              from neuro_ghost.converters.from_jsonschema import convert as js2lm
              try:
                  data = json.loads(content)
              except json.JSONDecodeError:
                  data = yaml.safe_load(content)
              linkml_dict = js2lm(data, name)
              with open(out_path, "w") as f:
                  yaml.dump(linkml_dict, f, default_flow_style=False,
                            allow_unicode=True, sort_keys=False)
              print(f"Converted → {out_path} ({len(linkml_dict['classes'])} classes)")
          else:
              print("Format: LinkML")
              with open(out_path, "w") as f:
                  f.write(content)
              print(f"Wrote {out_path}")

          # Source/bundle metadata sidecar from the form fields (keys = SchemaSource
          # / SchemaBundle slot names), with the web-UI's "### Source metadata" yaml
          # block as a fallback.
          meta = {}
          for key, label in [("bundle_label", "Bundle"), ("bundle_title", "Bundle title"),
                             ("homepage", "Homepage"), ("publisher", "Publisher"),
                             ("contact", "Contact"), ("license", "License")]:
              v = field(label)
              if v:
                  meta[key] = v
          sm = re.search(r'###\s*Source metadata\s*\n+```[\w-]*\s*\n(.*?)```', body, re.DOTALL)
          if sm:
              old = yaml.safe_load(sm.group(1))
              if isinstance(old, dict):
                  for k, v in old.items():
                      meta.setdefault(k, v)
          if meta:
              with open(f"registry_schemas/{name}_source.yaml", "w") as f:
                  yaml.safe_dump(meta, f, sort_keys=False, allow_unicode=True)
              print("Wrote sidecar:", list(meta))
          PYEOF

      # -----------------------------------------------------------------------
      # Reject a schema whose exact content is already committed under another
      # name — "this schema is already in the registry" — before ingesting.
      - name: Check for duplicate schema
        run: |
          python scripts/check_duplicate_schema.py \
            registry_schemas/${{ steps.meta.outputs.schema_name }}.yml

      # -----------------------------------------------------------------------
      - name: Validate LinkML schema
        run: |
          python neuro_ghost/validate_schema.py \
            registry_schemas/${{ steps.meta.outputs.schema_name }}.yml

      # -----------------------------------------------------------------------
      # Full rebuild from all registry_schemas/*.yml in the repo (including the new one
      # written above).  --skip-converters keeps CI fast — external schemas
      # (BIDS/NWB/DANDI/…) are refreshed by the weekly publish_registry.yml.
      - name: Rebuild registry (all local schemas)
        run: |
          python neuro_ghost/pipeline.py \
            --fresh \
            --skip-converters \
            --bump  ${{ steps.meta.outputs.bump }} \
            --issue ${{ github.event.issue.number }} \
            --agent "${{ github.event.issue.user.login }}"

      # -----------------------------------------------------------------------
      # Propose the ingested schema + rebuilt data as a PULL REQUEST (a review
      # gate) rather than committing straight to main — additions to the general
      # registry go through review.
      - name: Open pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="${{ steps.meta.outputs.schema_name }}"
          ISSUE="${{ github.event.issue.number }}"
          BRANCH="schema-submission/${NAME}-issue-${ISSUE}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add \
            registry_schemas/${NAME}.yml \
            data/registry.json \
            data/versions/ \
            data/provenance.json
          SIDECAR="registry_schemas/${NAME}_source.yaml"
          [ -f "$SIDECAR" ] && git add "$SIDECAR" || true
          if git diff --cached --quiet; then
            echo "No changes to propose (schema already in the registry)."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "feat(registry): ingest ${NAME} (issue #${ISSUE})"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --label schema-submission \
            --title "Ingest schema: ${NAME} (issue #${ISSUE})" \
            --body "Automated ingestion of \`${NAME}\` from issue #${ISSUE}. Review the schema and the rebuilt \`data/registry.json\` before merging into the registry. Closes #${ISSUE}")
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      - name: Comment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const name  = "${{ steps.meta.outputs.schema_name }}";
            const prUrl = "${{ steps.pr.outputs.pr_url }}";
            const body = prUrl
              ? [
                  `✅ **\`${name}\` validated and ingested — opened a PR for review.**`,
                  ``,
                  `${prUrl}`,
                  ``,
                  `Merging that PR adds the schema and the rebuilt registry, and closes this issue. Nothing lands in the registry until it's reviewed.`,
                ].join("\n")
              : [
                  `ℹ️ **\`${name}\` is already in the registry** — validated, but there was nothing new to propose.`,
                ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });

      - name: Comment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `❌ **Ingestion failed.**`,
                ``,
                `Check the run log for validation errors (undefined slot, \`is_a\` parent, or range).`,
                ``,
                `[View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
              ].join("\n"),
            });
