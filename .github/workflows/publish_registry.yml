name: Rebuild & Publish Registry

# Rebuilds data/ (registry.json, versions/, provenance.json) from the schemas
# already in registry_schemas/ (and the reviewed mappings in mappings/) and
# commits the result to main.
#
# This workflow never downloads external schemas. Fetching upstream schemas
# (BIDS/NWB/AIND/…) is a separate, manual step: fetch_external_schemas.yml opens
# a PR with the updated registry_schemas/*.yml, and merging it triggers this
# rebuild. Automatic weekly fetching is off for now (see issue #118).
on:
  push:
    branches: [main]
    paths:
      - "registry_schemas/**"
      - "mappings/**"
      - "meta_model.yaml"
      - "neuro_ghost/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (patch / minor / major)"
        required: false
        default: "patch"
        type: choice
        options: [patch, minor, major]

# One rebuild at a time; a queued run rebuilds from the latest main, so it
# also covers anything merged while the previous run was going.
concurrency:
  group: rebuild-registry
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push data/ back to main

    steps:
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build from the current tip of main, not the triggering commit, so a
          # queued run includes every merge and can push without conflicts.
          ref: main
          # Fetch full history so the bump commit doesn't squash provenance
          fetch-depth: 0

      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -----------------------------------------------------------------------
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # Sentence-transformers downloads all-MiniLM-L6-v2 (~90 MB) on first use.
      # Cache it so rebuilds don't re-download from Hugging Face every week.
      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-minilm-v2
          restore-keys: hf-

      # Embeddings are computed once per unique set of schema content and stored
      # in data/embeddings.parquet.  Cache keyed on schema file hashes so a
      # schema change forces a recompute while an unchanged run reuses it.
      - name: Cache embeddings
        uses: actions/cache@v4
        with:
          path: data/embeddings.parquet
          key: embeddings-${{ hashFiles('registry_schemas/*.yml') }}
          restore-keys: embeddings-

      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: pip install -r requirements.txt

      # -----------------------------------------------------------------------
      - name: Determine pipeline flags
        id: flags
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          BUMP="${{ inputs.bump || 'patch' }}"
          # A merged schema-submission PR carries "(issue #N)" in its commit
          # message; keep that link in provenance.json.
          ISSUE=$(printf '%s' "$COMMIT_MSG" | head -n1 | grep -oE 'issue #[0-9]+' | grep -oE '[0-9]+' | head -n1 || true)
          echo "bump=$BUMP"   >> $GITHUB_OUTPUT
          echo "issue=$ISSUE" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # Full pipeline: wipe → seed → ingest all local schemas → align → export
      - name: Seed, ingest, align, export
        run: |
          python neuro_ghost/pipeline.py \
            --fresh \
            --skip-converters \
            --bump  ${{ steps.flags.outputs.bump }} \
            ${{ steps.flags.outputs.issue && format('--issue {0}', steps.flags.outputs.issue) || '' }} \
            --agent "${{ github.actor }}"

      # -----------------------------------------------------------------------
      - name: Commit & push updated registry
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/registry.json data/versions/ data/provenance.json

          if git diff --cached --quiet; then
            echo "Registry unchanged — nothing to commit."
          else
            VERSION=$(python - <<'PY'
          import json, pathlib
          d = pathlib.Path("data/registry.json")
          if d.exists():
              print(json.loads(d.read_text()).get("registry_version", ""))
          PY
            )
            git commit -m "chore(registry): rebuild v${VERSION} [skip ci]"
            git push origin HEAD:main
          fi
