name: Schema submission
description: Submit a LinkML or JSON Schema to the NeuroGhost registry
title: "schema-submission: "
labels: ["schema-submission"]
body:
  - type: markdown
    attributes:
      value: |
        **Add a schema to the NeuroGhost registry.** Its classes and properties are
        harmonized with everything already registered. On submit, a workflow
        validates the schema, rebuilds the registry, and opens a **pull request**
        for review — nothing lands until that PR is merged.

        Finish the **title** above as `schema-submission: <short-name>` and fill in
        the fields below (the same fields as the web UI's Ingest page).

        **Two formats are accepted** (both end up as LinkML in the registry):
        - **LinkML** — YAML, e.g. `id: …`, `name: …`, `classes: {Person: {attributes: {…}}}`
        - **JSON Schema** — JSON, e.g. `{"type": "object", "properties": {"name": {"type": "string"}}}`
  - type: input
    id: name
    attributes:
      label: Schema name
      description: Short identifier used as the filename, e.g. `dandi`.
      placeholder: my-schema
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Format
      description: >-
        Pick **JSON Schema** if you're pasting JSON (`{ … }`), or **LinkML** if
        you're pasting YAML (`id:` / `classes:` …). Either way it's converted to
        LinkML on ingest.
      options:
        - LinkML (YAML)
        - JSON Schema
    validations:
      required: true
  - type: textarea
    id: schema
    attributes:
      label: Schema
      description: Paste the whole schema — LinkML YAML or JSON Schema, matching the Format above.
      render: yaml
    validations:
      required: true
  - type: markdown
    attributes:
      value: "### Source / bundle metadata (optional) — the same info as the Ingest page"
  - type: input
    id: bundle_label
    attributes:
      label: Bundle
      description: >-
        The logical schema this file belongs to. Leave blank for a new bundle
        named after the schema. Give several files the same value (e.g. `dandi`)
        to group them into one bundle.
  - type: input
    id: bundle_title
    attributes:
      label: Bundle title
      description: Optional human-readable name for the bundle, e.g. "DANDI Schema" (auto-filled if the schema declares a title).
  - type: input
    id: homepage
    attributes:
      label: Homepage
      placeholder: https://…
  - type: input
    id: publisher
    attributes:
      label: Publisher
  - type: input
    id: contact
    attributes:
      label: Contact
      placeholder: email or URL
  - type: input
    id: license
    attributes:
      label: License
      placeholder: e.g. CC-BY-4.0
