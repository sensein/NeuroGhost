id: https://example.org/schema-registry-utils/meta-model
name: schema_registry_meta_model
description: >-
  Meta-model for the schema registry: defines the registered object types
  (RegistryClass, RegistryProperty, and related support classes) used to
  describe classes and data elements that can be registered, versioned,
  related to each other, and compared for similarity.
  NOTE: `id` above is a placeholder namespace — replace before publishing.

prefixes:
  linkml: https://w3id.org/linkml/
  skos:   http://www.w3.org/2004/02/skos/core#
  prov:   http://www.w3.org/ns/prov#
  qudt:   http://qudt.org/schema/qudt/
  rdfs:   http://www.w3.org/2000/01/rdf-schema#
  screg:  https://example.org/schema-registry-utils/

default_prefix: screg
default_range: string

imports:
  - linkml:types

subsets:
  HashSubset:
    description: >-
      Slots that are part of a RegistryEntity subclass's content hash
      (hash_id). schema_registry_utils/hashing.py derives the identity
      field set from each field's in_subset metadata.

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------
# RegistryClass and RegistryProperty are the core entities.
# ProvenanceEntry is a standalone node (one per source attestation) — an
# entity accumulates a ProvenanceEntry per source rather than being tied to
# a single source, which is how identity stays separate from provenance.
# Rule, Transform, and ValueSet are stubs: present so the model shape is
# visible, slots intentionally left minimal until that work is scoped.

classes:

  RegistryEntity:
    abstract: true
    description: >-
      Common base for content-addressed, provenance-tracked objects registered
      in the schema registry. Identity (hash_id) is derived from content, so
      there is no separate version slot: a change produces a new hash_id, with
      lineage tracked via derived_from on each ProvenanceEntry.
    slots:
      - hash_id
      - name
      - description
      - provenance
      - skos_mappings
      - aliases

  RegistryClass:
    is_a: RegistryEntity
    description: >-
      A registered class (object class) representing a concept or entity type
      in the registry, e.g. "Patient".
    slots:
      - properties
      - is_a
      - mixins
      - class_uri
      - abstract

  RegistryProperty:
    is_a: RegistryEntity
    description: >-
      A registered property (data element) representing a characteristic or
      attribute that can be attached to a RegistryClass, e.g. "age". Usage
      constraints (required, multivalued, min/max, pattern) are deliberately
      not here — they belong on Rule, since the same property can be required
      in one source's usage and optional in another's without being a
      different concept.
    slots:
      - range
      - unit
      - slot_uri

  ProvenanceEntry:
    description: >-
      One source's attestation of a registry entity — where it came from and
      how/when this record was generated (W3C PROV-O fields). An entity
      accumulates one ProvenanceEntry per source that attests to it; identity
      (hash_id) never depends on provenance, so the same entity can carry many.
      Stored as its own node, linked via HAS_PROVENANCE / HAS_PROVENANCE_P
      edges (multivalued — cannot be inlined into the parent's node table).
      Identified by id, not hash_id — a ProvenanceEntry is a per-attestation
      record, not a deduplicated, content-addressed registry entity.
    slots:
      - id
      - had_primary_source
      - source_description
      - registry_version
      - generated_at_time
      - was_attributed_to
      - was_generated_by
      - was_derived_from

  MappingProvenanceEntry:
    is_a: ProvenanceEntry
    description: >-
      ProvenanceEntry, but had_primary_source isn't required — a Mapping is
      often cross-schema (comparing content from two sources) or produced
      by a pure algorithmic process with no single schema to attribute to,
      unlike a RegistryClass/RegistryProperty attestation which always
      traces back to exactly one SchemaSource. Also carries the fields that
      describe *how* the mapping was produced (justification, evidence,
      tool) — those belong here rather than on Mapping itself, alongside
      was_generated_by/generated_at_time.
    slot_usage:
      had_primary_source:
        required: false
    slots:
      - mapping_justification
      - match_string
      - mapping_tool

  Mapping:
    description: >-
      A semantic mapping from a registry entity to a target — another
      registry entity (by hash_id) or an external vocabulary concept (by
      IRI). Covers both a source-declared mapping and one align.py
      computes, distinguished by provenance.mapping_justification, not by
      class. Identified by id, not hash_id — not is_a RegistryEntity.
    slots:
      - id
      - mapping_type
      - target
      - confidence
      - review_status
      - provenance
    slot_usage:
      provenance:
        range: MappingProvenanceEntry

  Rule:
    description: >-
      STUB — a validation or business rule applicable to one or more registry
      entities (e.g. min/max value, pattern, required, multivalued constraints
      on a RegistryProperty). Slots intentionally minimal; scope TBD.
    slots:
      - hash_id
      - name
      - description

  Transform:
    description: >-
      STUB — a transformation between two RegistryClass definitions.
      Slots intentionally minimal; scope TBD.
    slots:
      - hash_id
      - name
      - description

  PermissibleValue:
    is_a: RegistryEntity
    description: >-
      A single permissible value within a ValueSet enumeration. The `name`
      field holds the value text (e.g. "EXACT_MATCH"); `meaning` optionally
      maps it to an external ontology IRI. Identity is content-addressed on
      (name, description, meaning) — identical values across sources share
      one node, with provenance accumulating like any other RegistryEntity.
    slots:
      - meaning

  ValueSet:
    is_a: RegistryEntity
    description: >-
      A controlled set of permissible values, usable as a RegistryProperty
      range. LinkML enums ingest as ValueSet nodes; each permissible value
      becomes a separate PermissibleValue node linked via
      HAS_PERMISSIBLE_VALUE edges.
    slots:
      - permissible_values

  UnitOfMeasure:
    class_uri: qudt:Unit
    annotations:
      db_inline: true
    description: >-
      A structured unit of measure for a RegistryProperty, inlined (not its
      own content-addressed entity). Field names/slot_uri follow LinkML's
      own linkml:units module — defined locally rather than imported, since
      db.py's DDL generator reads meta_model.yaml's own classes directly and
      doesn't resolve LinkML imports (see git history for the import-vs-
      repeat discussion). LinkML's own alignment for units *is* QUDT/rdfs —
      there's no separate "linkml:" URI for these concepts to also target.
    slots:
      - ucum_code
      - has_quantity_kind
      - symbol
      - abbreviation
      - descriptive_name

  SchemaSource:
    description: >-
      Registry record for a schema source (one node per ingested schema label).
      Tracks the source's IRI, MIME type, and the registry version it was first
      added under. Identity uses id (not hash_id) because this is a mutable
      administrative record, not a content-addressed entity.
    slots:
      - id
      - label
      - title
      - publisher
      - contact
      - homepage
      - is_hub
      - source_iri
      - source_version
      - mime_type
      - created_at
      - registry_version

  SchemaVersionSnapshot:
    description: >-
      An immutable snapshot of a schema at a specific version, created each
      time a schema ingestion produces new or changed content. Records the
      class and property counts and a human-readable summary of changes.

      QUESTIONABLE (as of 2026-08-04): likely unnecessary. It's write-only —
      nothing outside ingest_linkml.py's own _prev_schema_version() ever
      reads it back (not export_json.py, not mcp_server.py, not any CI
      workflow). Its source_version is a self-invented semver bump
      (_bump_semver()) that, after the first ingestion, ignores the source
      file's real declared meta["version"] entirely — and it duplicates
      SchemaSource.source_version, which has its own bug (frozen at
      first-ingestion value, never updated). The one thing it enables (the
      "schema unchanged, skip" short-circuit) doesn't need stored history:
      write_registry_entities() is already idempotent, so stats
      (classes_new/properties_new/provenance_added) tell you the same thing
      fresh on every run. Added incidentally in a1dba23 ("Auto-sync graph
      schema from meta_model.yaml via CI"), not from a deliberate versioning
      design. Candidate for removal — same category as the Relation class
      (removed in c599c2b): present in the schema, never actually needed.
    slots:
      - id
      - schema_label
      - source_version
      - yml_path
      - class_count
      - property_count
      - changes_summary
      - created_at
      - registry_version

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------

slots:

  hash_id:
    identifier: true
    required: true
    range: uriorcurie
    description: >-
      Content-hash-derived identifier (format sha256:<hex>). A change in
      any identity-defining field produces a new hash_id; lineage is
      preserved via derived_from.

  name:
    range: string
    required: true
    in_subset:
      - HashSubset
    description: Human-readable label for this entity.

  description:
    range: string
    required: true
    slot_uri: skos:definition
    in_subset:
      - HashSubset
    description: Human-readable description of this entity.

  provenance:
    range: ProvenanceEntry
    multivalued: true
    required: true
    # Inlined so generated code carries ProvenanceEntry objects rather than id
    # references: the pipeline builds entries in memory and hands them to the
    # graph writers, which split them into their own nodes on write.
    inlined: true
    inlined_as_list: true
    description: >-
      One ProvenanceEntry per source attesting to this entity. Accumulates
      as more sources are ingested — never affects hash_id.

  skos_mappings:
    range: Mapping
    multivalued: true
    inlined: true
    inlined_as_list: true
    description: Semantic mappings to external vocabulary concepts, or to other registry entities (align.py's computed correspondences).

  aliases:
    range: string
    multivalued: true
    slot_uri: skos:altLabel
    # Not in_subset: HashSubset — like class_uri/slot_uri, these are
    # alternate names a source happens to supply, not part of what the
    # entity *is*. Two sources asserting the same property/class with
    # different aliases must still collapse to one entity.
    description: >-
      Alternate names/synonyms/abbreviations for this entity (e.g. "lfp" for
      "local field potential"), preserved from the source schema. Used as
      alignment evidence (align.py's alias_overlap signal) — not part of
      the schema's own semantics.

  properties:
    range: RegistryProperty
    multivalued: true
    in_subset:
      - HashSubset
    description: The set of properties that belong to this class.

  is_a:
    range: RegistryClass
    slot_uri: linkml:is_a
    in_subset:
      - HashSubset
    description: The class this class inherits from (stored as hash_id FK).

  mixins:
    range: RegistryClass
    multivalued: true
    in_subset:
      - HashSubset
    description: Additional classes mixed into this class.

  range:
    range: string
    required: true
    slot_uri: linkml:range
    in_subset:
      - HashSubset
    description: >-
      The data type or value range for this property (e.g. a primitive type
      name such as "string" or "integer", or the hash_id of a ValueSet for
      enumerated values).

  unit:
    range: UnitOfMeasure
    inlined: true
    slot_uri: qudt:unit
    in_subset:
      - HashSubset
    description: >-
      Structured unit of measure for this property's values, if applicable.
      ucum_code is the primary field for programmatic unit-compatibility
      checks (align.py's unit veto); the others are supplementary.

  class_uri:
    range: uriorcurie
    slot_uri: linkml:class_uri
    description: >-
      Ontology IRI for this class, preserved from the source schema on
      ingestion. Not part of the content hash; used for alignment and
      cross-source lookup.

  slot_uri:
    range: uriorcurie
    description: >-
      Ontology IRI for this property, preserved from the source schema on
      ingestion. Not part of the content hash; used for alignment and
      cross-source lookup.

  abstract:
    range: boolean
    slot_uri: linkml:abstract
    in_subset:
      - HashSubset
    # Defaults to false rather than null: `abstract` is identity-defining, so a
    # null would hash differently from a false and silently change every
    # RegistryClass hash_id. LinkML has no equivalent for the multivalued slots
    # (properties/mixins), which still default to null — builders
    # must pass them explicitly, and compute_hash_id_for() enforces that.
    ifabsent: 'false'
    description: Whether this registered class is itself declared abstract.

  # --- Plain (non-content-hashed) identifier, shared by every class that
  # --- isn't part of the RegistryEntity family -------------------------------

  id:
    identifier: true
    required: true
    range: string
    description: >-
      Plain unique identifier, used by every class that isn't part of the
      content-addressed RegistryEntity family (ProvenanceEntry, SchemaSource,
      SchemaVersionSnapshot, Mapping) — LinkML's own conventional name
      for a non-content-derived identifier. hash_id is reserved for
      RegistryEntity subclasses.

  had_primary_source:
    range: SchemaSource
    required: true
    slot_uri: prov:hadPrimarySource
    description: >-
      The SchemaSource this attestation came from (stored as id FK, like
      is_a). A real Entity->Entity link, not a denormalized label copy —
      PROV-O's own hadPrimarySource is a relationship between entities.

  source_description:
    range: string
    description: >-
      This source's own description text for the entity, if it differs
      from the entity's merged description. No direct PROV-O term; a
      registry-specific extension.

  registry_version:
    range: string
    description: >-
      Registry snapshot version in effect when this ProvenanceEntry was
      generated. Not on RegistryClass/RegistryProperty directly — the same
      entity can be attested by different sources at different times, each
      under a different registry version, so it belongs on the per-source
      attestation, not the entity itself. No PROV-O term — purely our own
      versioning concept.

  generated_at_time:
    range: datetime
    required: true
    slot_uri: prov:generatedAtTime
    description: ISO-8601 timestamp this ProvenanceEntry was generated.

  was_attributed_to:
    range: string
    required: true
    slot_uri: prov:wasAttributedTo
    description: Agent (user or system) that generated this ProvenanceEntry.

  was_generated_by:
    range: string
    slot_uri: prov:wasGeneratedBy
    description: >-
      The activity that produced this ProvenanceEntry, e.g. "ingestion",
      "manual", "alignment".

  was_derived_from:
    range: string
    multivalued: true
    slot_uri: prov:wasDerivedFrom
    description: >-
      hash_ids of entities this entity was derived from, if any. Stored as
      a native list column in the graph database.

  # --- Mapping slots ---------------------------------------------------

  mapping_type:
    range: SkosMappingTypeEnum
    description: The kind of SKOS mapping relation this represents.

  target:
    range: uriorcurie
    description: >-
      What this mapping points to — an external ontology concept (IRI), or
      another registry entity's hash_id for align.py's computed
      cross-schema correspondences.

  # --- MappingProvenanceEntry-only slots: how the mapping was produced ---

  mapping_justification:
    range: string
    description: >-
      How this mapping came to be, e.g. "manual" for a source-schema-
      declared mapping, or "exact_class_uri" for align.py's placeholder.
      Plain string for now rather than a controlled vocabulary (e.g.
      semapv) — nothing yet produces enough distinct justifications to
      need one.

  match_string:
    range: string
    multivalued: true
    description: The strings/evidence the match was made on, if any.

  mapping_tool:
    range: string
    description: Name of the tool/process that produced this mapping, e.g. "align.py".

  confidence:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: >-
      Score in [0,1] assigned by whatever process produced this mapping.
      Not required — a manually-declared mapping may have no numeric score.

  review_status:
    range: ReviewStatusEnum
    description: >-
      Curation lifecycle state. Always PROPOSED for now — nothing in this
      registry curates mappings yet, so this field exists to be
      standards-conformant (SSSOM/Proteus), not because anything sets it
      to ACCEPTED/REJECTED today.

  # --- SchemaSource / SchemaVersionSnapshot slots --------------------------

  label:
    range: string
    required: true
    description: Short identifier label for this schema source (e.g. "bids", "nwb").

  title:
    range: string
    description: >-
      Human-readable full name of the schema (e.g. "Brain Imaging Data
      Structure"), distinct from the short `label` used as its identifier.

  publisher:
    range: string
    description: Organization or group that maintains this schema.

  contact:
    range: string
    description: Contact point for this schema (person, mailing list, or URL).

  homepage:
    range: uri
    description: Documentation or landing page for this schema.

  is_hub:
    range: boolean
    ifabsent: 'false'
    description: >-
      True if this schema is (part of) the registry's core/bridge
      vocabulary that other schemas are matched against, rather than
      matching every schema pairwise. Not auto-derived — set deliberately,
      since which schema serves as the hub is a curatorial decision.

  source_iri:
    range: uriorcurie
    description: Canonical IRI for this schema source.

  source_version:
    range: string
    description: Semantic version of the schema at the time of ingestion.

  mime_type:
    range: string
    description: MIME type of the schema file (e.g. "application/yaml").

  created_at:
    range: datetime
    description: ISO-8601 timestamp when this record was created.

  schema_label:
    range: string
    required: true
    description: Label of the schema this snapshot belongs to (FK to SchemaSource.label).

  yml_path:
    range: string
    description: Relative path to the schema YAML file at snapshot time.

  class_count:
    range: integer
    description: Number of classes in the schema at this version.

  property_count:
    range: integer
    description: Number of properties in the schema at this version.

  changes_summary:
    range: string
    description: Human-readable summary of what changed in this version.

  # --- PermissibleValue / ValueSet slots ------------------------------------

  meaning:
    range: uriorcurie
    in_subset:
      - HashSubset
    description: >-
      Ontology IRI this permissible value maps to (e.g. skos:exactMatch
      for the EXACT_MATCH value in SkosMappingTypeEnum).

  permissible_values:
    range: PermissibleValue
    multivalued: true
    in_subset:
      - HashSubset
    description: >-
      The set of permissible values for this ValueSet. Stored as hash_id
      references; HAS_PERMISSIBLE_VALUE edges are the graph traversal.

  # --- UnitOfMeasure slots ---------------------------------------------------

  ucum_code:
    range: string
    slot_uri: qudt:ucumCode
    description: >-
      UCUM (Unified Code for Units of Measure) code, e.g. "mV", "deg", "Hz".
      Compact and machine-parseable — the primary field for programmatic
      unit-compatibility checks (align.py's unit veto).

  has_quantity_kind:
    range: uriorcurie
    slot_uri: qudt:hasQuantityKind
    description: >-
      IRI naming the dimension/kind of quantity being measured, e.g. a QUDT
      quantity-kind IRI for "ElectricPotential" or "PlaneAngle". Lets
      incommensurable units (different quantity kinds) be vetoed outright,
      independent of whether a conversion factor is known.

  symbol:
    range: string
    slot_uri: qudt:symbol
    description: Name of the unit encoded as a symbol (e.g. "Ω", "°").

  abbreviation:
    range: string
    slot_uri: qudt:abbreviation
    description: >-
      Short ASCII abbreviation for the unit, for contexts where non-ASCII
      symbols would be problematic.

  descriptive_name:
    range: string
    slot_uri: rdfs:label
    description: The spelled-out name of the unit, e.g. "millivolt".

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

enums:

  SkosMappingTypeEnum:
    description: The kind of SKOS mapping relation between a registry entity and an external concept.
    permissible_values:
      EXACT_MATCH:
        meaning: skos:exactMatch
        description: The registry entity is equivalent to the external concept.
      CLOSE_MATCH:
        meaning: skos:closeMatch
        description: The registry entity is sufficiently similar to the external concept.
      BROAD_MATCH:
        meaning: skos:broadMatch
        description: The external concept is broader than the registry entity.
      NARROW_MATCH:
        meaning: skos:narrowMatch
        description: The external concept is narrower than the registry entity.
      RELATED_MATCH:
        meaning: skos:relatedMatch
        description: The registry entity is related to the external concept.

  ReviewStatusEnum:
    description: Curation lifecycle of a Mapping.
    permissible_values:
      PROPOSED:
        description: Machine- or human-proposed; not yet reviewed.
      ACCEPTED:
        description: Validated by a reviewer; safe for high-rigor queries.
      REJECTED:
        description: Reviewed and refuted; retained as negative evidence.
      SUPERSEDED:
        description: Replaced by a newer mapping.
