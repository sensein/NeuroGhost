id: https://example.org/schema-registry-utils/meta-model
name: schema_registry_meta_model
description: >-
  Meta-model for the schema registry: defines the registered object types
  (RegistryClass, RegistryProperty, and related support classes) used to
  describe classes and data elements that can be registered, versioned,
  related to each other, and compared for similarity.
  NOTE: `id` above is a placeholder namespace — replace before publishing.

prefixes:
  linkml: https://w3id.org/linkml/
  skos:   http://www.w3.org/2004/02/skos/core#
  prov:   http://www.w3.org/ns/prov#
  qudt:   http://qudt.org/schema/qudt/
  rdfs:   http://www.w3.org/2000/01/rdf-schema#
  owl:    http://www.w3.org/2002/07/owl#
  screg:  https://example.org/schema-registry-utils/

default_prefix: screg
default_range: string

imports:
  - linkml:types

subsets:
  HashSubset:
    description: >-
      Slots that are part of a RegistryEntity subclass's content hash
      (sha256_hash). schema_registry_utils/hashing.py derives the identity
      field set from each field's in_subset metadata.

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------
# RegistryClass and RegistryProperty are the core entities.
# ProvenanceEntry is a standalone node (one per source attestation) — an
# entity accumulates a ProvenanceEntry per source rather than being tied to
# a single source, which is how identity stays separate from provenance.
# Transform is still a stub: present so the model shape is visible, slots
# intentionally left minimal until that work is scoped.

classes:

  RegistryEntity:
    abstract: true
    description: >-
      Common base for provenance-tracked objects registered in the schema
      registry.

      Identity vs. content-address are two separate concerns here:

      * `id` is a UUID (uuid4) minted on first ingest — the registry's stable
        graph handle. Cross-references (class properties, parent_class,
        class_mixins, RegistryRule.applies_to / rule_value range targets,
        ProvenanceEntry.attests_to) all use UUIDs, so every FK is uniform
        regardless of the referent's type or whether it is content-addressed.

      * `sha256_hash` is a content fingerprint derived from the fields marked
        `in_subset: HashSubset` in this schema. It is not the identifier;
        instead it drives cross-source deduplication — on ingest, an entity
        whose sha256_hash already exists in the graph reuses its existing
        `id` rather than minting a new UUID, so the same concept ingested
        from two sources collapses to one row that accumulates provenance
        from both. A content change produces a different sha256_hash (a
        different entity), never an edit of the old one; lineage is tracked
        via was_derived_from on each ProvenanceEntry.
    slots:
      - id
      - sha256_hash
      - name
      - description
      - provenance
      - skos_mappings
      - aliases
      - concept_uri

  RegistryClass:
    is_a: RegistryEntity
    description: >-
      A registered class (object class) representing a concept or entity type
      in the registry, e.g. "Patient".
    slots:
      - properties
      - parent_class
      - class_mixins
      - is_abstract
      - is_mixin

  RegistryProperty:
    is_a: RegistryEntity
    description: >-
      A registered property (data element) representing a characteristic or
      attribute that can be attached to a RegistryClass, e.g. "age". A
      RegistryProperty is a *pure concept*: its identity is its name and
      description, nothing about how a particular schema realizes it. Usage
      constraints (required, multivalued, min/max, pattern) AND the value
      type/range and unit are deliberately not here — they belong on
      RegistryRule (rule_type RANGE for the type, one RANGE rule per permitted
      range; UNIT for the unit), because the same concept can be required in
      one source and optional in another, or typed as an integer here and a
      string there, or measured in years here and months there, without being
      a different concept. This is what lets "age" from two schemas collapse to
      one entry — the type/unit differences live on per-source rules, not on
      the property.

  ProvenanceEntry:
    description: >-
      One source's attestation of a registry entity — where it came from and
      how/when this record was generated (W3C PROV-O fields). An entity
      accumulates one ProvenanceEntry per source that attests to it; identity
      (id) never depends on provenance, so the same entity can carry many.
      Stored as its own node, linked via HAS_PROVENANCE / HAS_PROVENANCE_P
      edges (multivalued — cannot be inlined into the parent's node table).
      Identified by id — a ProvenanceEntry is a per-attestation
      record, not a deduplicated, content-addressed registry entity.

      Carries `attests_to` (the reverse of `RegistryEntity.provenance`) so
      the entry is standalone-readable: schema regeneration can start from
      "every ProvenanceEntry whose had_primary_source is this schema" and
      walk `attests_to` in one hop instead of scanning every entity's
      provenance list. The forward edge (entity → provenance) and the
      reverse slot (provenance → entity) express the same fact and must
      be kept in sync at ingest.
    slots:
      - id
      - attests_to
      - had_primary_source
      - source_version
      - registry_version
      - generated_at_time
      - was_attributed_to
      - was_generated_by
      - was_derived_from

  MappingProvenanceEntry:
    is_a: ProvenanceEntry
    description: >-
      ProvenanceEntry, but had_primary_source isn't required — a Mapping is
      often cross-schema (comparing content from two sources) or produced
      by a pure algorithmic process with no single schema to attribute to,
      unlike a RegistryClass/RegistryProperty attestation which always
      traces back to exactly one SchemaSource. Also carries the fields that
      describe *how* the mapping was produced (justification, evidence,
      tool) — those belong here rather than on Mapping itself, alongside
      was_generated_by/generated_at_time.
    slot_usage:
      had_primary_source:
        required: false
      attests_to:
        range: Mapping
    slots:
      - mapping_justification
      - match_string
      - mapping_tool

  Mapping:
    description: >-
      A semantic mapping from a registry entity to a target — another
      registry entity (by id) or an external vocabulary concept (by
      IRI). Covers both a source-declared mapping and one align.py
      computes, distinguished by provenance.mapping_justification, not by
      class. Identified by id — not is_a RegistryEntity.
    slots:
      - id
      - mapping_type
      - target
      - confidence
      - review_status
      - mapping_set_id
      - provenance
    slot_usage:
      provenance:
        range: MappingProvenanceEntry

  RegistryRule:
    is_a: RegistryEntity
    description: >-
      A validation or business rule that constrains one or more registry
      entities. Covers both the declarative property-level constraints a
      source schema states directly (regex pattern, min/max value,
      length/cardinality bounds, required, multivalued, enum membership —
      dandi-schema's `Field(pattern=..., min_length=..., max_length=...)`,
      LinkML's slot facets, JSON Schema's keyword set) and the class-level
      cross-field constraints those schemas express as model validators
      (dandi-schema's `@model_validator` — e.g. "ContactPerson requires
      email", "datePublished implies publishedBy and doi", "identifier or
      url must be present"). Both surface in the same registry so alignment
      can compare them: two schemas that state "identifier matches ORCID"
      about the same-hash property should recognize the equivalence.

      Each declarative constraint is one RegistryRule — one facet, one node. A
      property with a lower bound of 0 and an upper bound of 120 ingests
      as two RegistryRules (rule_type=MIN_VALUE with rule_value="0", and
      rule_type=MAX_VALUE with rule_value="120"), not one, so a source
      that only sets a lower bound isn't implicitly asserting anything
      about an upper bound, and a class-level refinement of the lower
      bound doesn't sweep up the upper bound (matching LinkML
      slot_usage, which refines facets independently).

      The constraint is expressed via two slots: `rule_type` names the
      kind of constraint and `rule_value` carries its parameter as a
      string, interpreted per rule_type — a regex for PATTERN, a
      numeric literal for MIN_VALUE/MAX_VALUE, a length for
      MIN_LENGTH/MAX_LENGTH, "true"/"false" for REQUIRED/MULTIVALUED, a
      RegistryValueSet id for ENUM_MEMBERSHIP, an XSD CURIE for RANGE, the
      literal default for DEFAULT, the whole validator body for
      EXPRESSION_*, and so on. This single-value shape is why exclusive
      bounds and expression languages are encoded as rule_type variants
      (MIN_VALUE_EXCLUSIVE, EXPRESSION_SHACL, …) rather than as
      supplementary flag or language slots.

      Identity is content-addressed like any RegistryEntity and collapses
      across schemas: same rule_type + same rule_value + same applies_to
      + same used_in_class hash to the same RegistryRule, so two source schemas
      that state "identifier matches ORCID" on the same-hash property
      collapse to one RegistryRule node with both schemas attesting to it via
      `provenance` — matching the cross-schema identity behavior main
      restored in 534ee4b. A schema that changes only the human-readable
      `error_message` keeps its sha256_hash (see the HashSubset membership on
      each slot). RegistryRules are attached to RegistryClass/RegistryProperty
      through the `applies_to` slot — not inlined on the entity itself,
      so a RegistryRule's targets are visible as edges in the graph.

      LinkML slot_usage (and equivalent per-class refinements in other
      schema languages) is modeled through the optional `used_in_class`
      slot — mirroring LinkML's own `slot_usage` vocabulary — rather
      than a separate override entity or an inheritance chain. A RegistryRule
      with `used_in_class` unset is a schema-level default — effective
      wherever its `applies_to` property is used, unless a more
      specific RegistryRule takes precedence. A RegistryRule with
      `used_in_class = ClassB` is a class-level refinement — effective
      only when the property is used inside ClassB, and it overrides
      the schema-level RegistryRule of the *same rule_type* on the *same
      applies_to* property (rule_type-by-rule_type, matching LinkML's
      slot_usage semantics: overriding PATTERN in one class does not
      also drop the schema-level REQUIRED). Class-level rules that
      aren't slot refinements at all — dandi-schema's cross-field
      `@model_validator` for "identifier or url must be present" — use
      the same mechanism: `used_in_class = ContactCard`,
      `applies_to = [identifier_property, url_property]`,
      `rule_type = EXPRESSION_PYTHON`; no special-casing.

      Effective-rule resolution for property P used inside class C is
      therefore: for each rule_type, prefer the RegistryRule with
      `used_in_class = C and applies_to contains P` if one exists;
      otherwise fall back to the RegistryRule with `used_in_class` unset. The
      registry does not currently execute this resolution — it stores
      both the schema-level and class-level RegistryRules as data — but the
      model is shaped so a downstream validator (or an alignment pass
      that wants to compare "the effective pattern on this slot in this
      class") can do so with a single graph walk.
    slots:
      - used_in_class
      - rule_type
      - rule_value
      - applies_to
      - severity
      - error_message
      - referenced_entities

  Transform:
    description: >-
      STUB — a transformation between two RegistryClass definitions.
      Slots intentionally minimal; scope TBD.
    slots:
      - id
      - name
      - description

  PermissibleValue:
    is_a: RegistryEntity
    description: >-
      A single permissible value within a RegistryValueSet enumeration. The `name`
      field holds the value text (e.g. "EXACT_MATCH"); `meaning` optionally
      maps it to an external ontology IRI. Identity is content-addressed on
      (name, description, meaning) — identical values across sources share
      one node, with provenance accumulating like any other RegistryEntity.
    slots:
      - meaning

  RegistryValueSet:
    is_a: RegistryEntity
    description: >-
      A controlled set of permissible values, usable as a RegistryProperty
      range. LinkML enums ingest as RegistryValueSet nodes; each permissible value
      becomes a separate PermissibleValue node linked via
      HAS_PERMISSIBLE_VALUE edges.
    slots:
      - permissible_values

  SchemaSource:
    description: >-
      Registry record for a schema source (one node per ingested schema label).
      A stable label used to attribute registry entities to where they came
      from — nothing more. Every attestation about a registry entity that
      names this schema as its primary source is surfaced on `attestations`,
      the inverse of ProvenanceEntry.had_primary_source, so a schema-regen
      query can walk forward from a SchemaSource to every entity it defined
      in one hop.

      Deliberately does NOT model the ingested schema's shape metadata
      (default_prefix, default_range, declared prefix bindings, imports).
      RegistrySchema owns the "schema-shape" concerns for schemas the
      registry emits; SchemaSource is only a provenance record. Reconstructing
      the source schema verbatim isn't a registry use case today, so those
      fields don't need to be captured on the input side.

      Identity uses id (a UUID, as everywhere) because this is a mutable
      administrative record, not a content-addressed entity. A SchemaSource is
      one physical file/module; the schema-level descriptive metadata (title,
      publisher, contact, homepage, license, the declared source_id/iri) lives
      once on the SchemaBundle this source is `part_of`, not repeated here.
      What stays on the source is what is genuinely per-file: its `label`,
      `content_hash`, `mime_type`, ingest `created_at`/`registry_version`, and
      an optional per-file `source_version` override.
    slots:
      - id
      - label
      - part_of
      - source_version
      - mime_type
      - content_hash
      - created_at
      - registry_version
      - attestations

  SchemaBundle:
    description: >-
      A logical schema, grouping the one-or-more SchemaSource files it is
      ingested from (e.g. DANDI = dandiset.json + asset.json). Schema-level
      descriptive metadata — title, publisher, contact, homepage, license, and
      the schema's own declared source_id / source_iri / source_version — lives
      here once, rather than being repeated on every constituent file. A
      single-file schema is simply a bundle with exactly one part.

      Identity uses id (a UUID) — a mutable administrative record, like
      SchemaSource. On (re-)ingestion a bundle is resolved-or-created by its
      declared `source_id` (falling back to `label`), so every file that
      declares the same schema id joins the same bundle. `parts` is the inverse
      of SchemaSource.part_of.
    slots:
      - id
      - label
      - title
      - description
      - source_id
      - source_iri
      - source_version
      - publisher
      - contact
      - homepage
      - license
      - created_at
      - parts

  SchemaVersionSnapshot:
    description: >-
      An immutable snapshot of a schema at a specific version, created each
      time a schema ingestion produces new or changed content. Records the
      class and property counts and a human-readable summary of changes.

      QUESTIONABLE (as of 2026-08-04): likely unnecessary. It's write-only —
      nothing outside ingest_linkml.py's own _prev_schema_version() ever
      reads it back (not export_json.py, not mcp_server.py, not any CI
      workflow). Its source_version is a self-invented semver bump
      (_bump_semver()) that, after the first ingestion, ignores the source
      file's real declared meta["version"] entirely — and it duplicates
      SchemaSource.source_version, which has its own bug (frozen at
      first-ingestion value, never updated). The one thing it enables (the
      "schema unchanged, skip" short-circuit) doesn't need stored history:
      write_registry_entities() is already idempotent, so stats
      (classes_new/properties_new/provenance_added) tell you the same thing
      fresh on every run. Added incidentally in a1dba23 ("Auto-sync graph
      schema from meta_model.yaml via CI"), not from a deliberate versioning
      design. Candidate for removal — same category as the Relation class
      (removed in c599c2b): present in the schema, never actually needed.
    slots:
      - id
      - schema_label
      - source_version
      - yml_path
      - class_count
      - property_count
      - changes_summary
      - created_at
      - registry_version

  RegistrySchema:
    description: >-
      A schema composed from existing registry content — a named, curated
      subset of RegistryClasses/RegistryProperties/RegistryRules/RegistryValueSets that can
      be exported as a standalone schema file (LinkML today; other output
      formats are a serialization concern, not modeled here). Unlike
      SchemaSource, which records where an *ingested* schema came from,
      membership here is an explicit curatorial selection — there is no
      attestation trail to derive it from, since composing this schema is
      the act that creates the selection in the first place.

      Exported as full IRIs, not CURIEs: the registry already expands every
      CURIE to a full IRI at ingest time (see resolve_prefix() in
      ingest_linkml.py), so there is no original prefix mapping left to
      preserve, and inventing a fresh one here would just be another map to
      keep in sync. A full IRI is valid wherever LinkML accepts a CURIE, so
      this is a v1 scope choice, not a limitation of the format.

      Identified by id: two people composing an identical
      subset of content for different purposes are not the same entity.
    slots:
      - id
      - name
      - description
      - namespace_iri
      - default_range
      - imports
      - registry_classes
      - registry_properties
      - registry_rules
      - registry_value_sets
      - created_by
      - created_at

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------

slots:

  sha256_hash:
    range: string
    required: true
    description: >-
      Content fingerprint (format `sha256:<hex>`) derived from the fields
      marked `in_subset: HashSubset` on this entity's class. Not the
      identifier — `id` (UUID) is — but content-addressed and stable across
      sources: two sources that submit identical content produce identical
      sha256_hash values, and ingestion uses that equality to reuse an
      existing `id` rather than mint a new UUID for the duplicate.

      A change in any HashSubset field produces a different sha256_hash
      (a different entity), never an edit of the old one; lineage is
      tracked via was_derived_from on each ProvenanceEntry.

  name:
    range: string
    required: true
    in_subset:
      - HashSubset
    description: Human-readable label for this entity.

  description:
    range: string
    required: true
    slot_uri: skos:definition
    in_subset:
      - HashSubset
    description: Human-readable description of this entity.

  provenance:
    range: ProvenanceEntry
    multivalued: true
    required: true
    inverse: attests_to
    # Reference by ProvenanceEntry.id (UUID), not inlined: the graph stores
    # ProvenanceEntry as its own node linked via HAS_PROVENANCE /
    # HAS_PROVENANCE_P edges, so the pydantic model matches that reality —
    # builders construct the ProvenanceEntry alongside the entity and pass
    # its id here, rather than embedding the whole object.
    description: >-
      One ProvenanceEntry per source attesting to this entity. Accumulates
      as more sources are ingested — never affects id or sha256_hash. Mirrored by
      ProvenanceEntry.attests_to so the relationship round-trips in either
      direction — the entity owns the list, and each entry names the
      entity it belongs to.

  attests_to:
    range: RegistryEntity
    required: true
    inverse: provenance
    # Reverse pointer to the entity this ProvenanceEntry belongs to.
    # Not in HashSubset — ProvenanceEntry is not content-addressed;
    # identity is the plain `id` slot. The relationship is also
    # materialized as a HAS_PROVENANCE edge by the graph writer; this
    # slot is what makes a serialized ProvenanceEntry standalone
    # (schema regeneration from JSON, SSSOM-style exports, standalone
    # audit logs — anything that reads provenance without also
    # holding the owning entity in the same query).
    description: >-
      The RegistryEntity (or Mapping, on MappingProvenanceEntry) this
      attestation is about. Singular — one ProvenanceEntry belongs to
      exactly one entity; a schema that attested to N entities produces
      N separate ProvenanceEntry nodes, each with its own attests_to
      pointer. Redundant with the parent's `provenance` list, kept in
      sync at ingest — the two directions serve different consumers
      (top-down: `entity.provenance` for reading an entity's history;
      bottom-up: `attests_to` for regenerating a schema by starting
      from every ProvenanceEntry whose had_primary_source is that
      schema).

  skos_mappings:
    range: Mapping
    multivalued: true
    description: >-
      Semantic mappings to external vocabulary concepts, or to other
      registry entities (align.py's computed correspondences). Reference by
      Mapping.id (UUID) — the mapping is a separate node so it can be
      queried and shared across owners; SSSOM export still materializes
      subject_id from the owning entity's id, so exported mapping sets
      remain standalone, standards-conformant records.

  aliases:
    range: string
    multivalued: true
    slot_uri: skos:altLabel
    # Not in_subset: HashSubset — alternate names a source happens to
    # supply, not part of what the entity *is*. Keeping aliases out of the
    # hash means an alias edit doesn't mint a new identity, and two sources'
    # otherwise-identical entities still collapse even if their alias lists
    # differ.
    description: >-
      Alternate names/synonyms/abbreviations for this entity (e.g. "lfp" for
      "local field potential"), preserved from the source schema. Used as
      alignment evidence (align.py's alias_overlap signal) — not part of
      the schema's own semantics.

  properties:
    range: RegistryProperty
    multivalued: true
    in_subset:
      - HashSubset
    description: The set of properties that belong to this class.

  parent_class:
    range: RegistryClass
    slot_uri: linkml:is_a
    in_subset:
      - HashSubset
    description: The class this class inherits from (stored as UUID id FK).

  class_mixins:
    range: RegistryClass
    multivalued: true
    in_subset:
      - HashSubset
    description: Additional classes mixed into this class.

  concept_uri:
    range: uriorcurie
    description: >-
      Ontology IRI for this entity (class or property), preserved from the
      source schema on ingestion. Not part of the content hash; used for
      alignment and cross-source lookup.

  is_abstract:
    range: boolean
    slot_uri: linkml:abstract
    in_subset:
      - HashSubset
    # Defaults to false rather than null: `is_abstract` is identity-defining,
    # so a null would hash differently from a false and silently change every
    # RegistryClass sha256_hash. LinkML has no equivalent for the multivalued slots
    # (properties/class_mixins), which still default to null — builders
    # must pass them explicitly, and compute_content_hash_for() enforces that.
    ifabsent: 'false'
    description: Whether this registered class is itself declared abstract.

  is_mixin:
    range: boolean
    slot_uri: linkml:mixin
    ifabsent: 'false'
    in_subset:
      - HashSubset
    # Semantically identity-defining (a mixin class is a different concept
    # from a non-mixin with otherwise identical content), same as
    # is_abstract. Now plumbed through parse_linkml + build_registry_entities
    # (previously always defaulted to false regardless of the source's own
    # `mixin: true`).
    description: >-
      Whether this registered class is itself declared a mixin (a class
      designed to be composed into others rather than instantiated directly).
      Independent of `is_abstract`; the two flags may be true simultaneously.

  # --- Plain (non-content-hashed) identifier, shared by every class that
  # --- isn't part of the RegistryEntity family -------------------------------

  id:
    identifier: true
    required: true
    range: string
    description: >-
      UUID (uuid4) primary key for every registered object, minted at
      first ingest and stable across content changes. Used uniformly by
      RegistryEntity subclasses and by non-content-addressed classes
      (ProvenanceEntry, SchemaSource, SchemaVersionSnapshot, Mapping),
      so cross-references are the same shape regardless of the referent's
      family. For RegistryEntity subclasses the `sha256_hash` fingerprint
      is what enables cross-source dedup — see RegistryEntity's own
      description.

  had_primary_source:
    range: SchemaSource
    required: true
    slot_uri: prov:hadPrimarySource
    inverse: attestations
    description: >-
      The SchemaSource this attestation came from (stored as id FK, like
      is_a). A real Entity->Entity link, not a denormalized label copy —
      PROV-O's own hadPrimarySource is a relationship between entities.
      Mirrored by SchemaSource.attestations so the relationship
      round-trips: a query starting from a SchemaSource can walk forward
      to every ProvenanceEntry that names it.

  registry_version:
    range: string
    description: >-
      Registry snapshot version in effect when this ProvenanceEntry was
      generated. Not on RegistryClass/RegistryProperty directly — the same
      entity can be attested by different sources at different times, each
      under a different registry version, so it belongs on the per-source
      attestation, not the entity itself. No PROV-O term — purely our own
      versioning concept.

  generated_at_time:
    range: datetime
    required: true
    slot_uri: prov:generatedAtTime
    description: ISO-8601 timestamp this ProvenanceEntry was generated.

  was_attributed_to:
    range: string
    required: true
    slot_uri: prov:wasAttributedTo
    description: Agent (user or system) that generated this ProvenanceEntry.

  was_generated_by:
    range: string
    slot_uri: prov:wasGeneratedBy
    description: >-
      The activity that produced this ProvenanceEntry, e.g. "ingestion",
      "manual", "alignment".

  was_derived_from:
    range: string
    multivalued: true
    slot_uri: prov:wasDerivedFrom
    description: >-
      UUID ids of entities this entity was derived from, if any. Stored as
      a native list column in the graph database.

  # --- Mapping slots ---------------------------------------------------

  mapping_type:
    range: SkosMappingTypeEnum
    description: The kind of SKOS mapping relation this represents.

  target:
    range: uriorcurie
    description: >-
      What this mapping points to — an external ontology concept (IRI), or
      another registry entity's id for align.py's computed
      cross-schema correspondences.

  # --- MappingProvenanceEntry-only slots: how the mapping was produced ---

  mapping_justification:
    range: string
    description: >-
      How this mapping came to be. Values SHOULD be semapv CURIEs
      (https://w3id.org/semapv/vocab/): semapv:ManualMappingCuration for
      source-declared or human-curated mappings, semapv:LexicalMatching,
      semapv:SemanticSimilarityThresholdMatching,
      semapv:StructuralMatching, semapv:LogicalReasoning,
      semapv:CompositeMatching for computed ones. The range stays string
      (no enum migration forced), but free-form values ("manual",
      "exact_class_uri") are deprecated: the alignment pipeline keys
      review, predicate policy, and per-method evaluation off these
      terms, and SSSOM requires them — a free string collapses the
      distinction between statistical evidence and declared semantics.

  match_string:
    range: string
    multivalued: true
    description: The strings/evidence the match was made on, if any.

  mapping_tool:
    range: string
    description: Name of the tool/process that produced this mapping, e.g. "align.py".

  mapping_set_id:
    range: string
    description: >-
      Identifier of the mapping set (one matcher run, one curation
      campaign, one source-declaration ingestion) this mapping belongs
      to. Optional. This is the unit of run-level provenance and
      wholesale supersession: a miscalibrated run is superseded by set,
      not mapping-by-mapping, and one run exports as one SSSOM TSV.

  confidence:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: >-
      Score in [0,1] assigned by whatever process produced this mapping.
      Not required — a manually-declared mapping may have no numeric score.

  review_status:
    range: ReviewStatusEnum
    description: >-
      Curation lifecycle state. Always PROPOSED for now — nothing in this
      registry curates mappings yet, so this field exists to be
      standards-conformant (SSSOM/Proteus), not because anything sets it
      to ACCEPTED/REJECTED today.

  # --- RegistryRule slots ------------------------------------------------------------

  rule_type:
    range: RegistryRuleTypeEnum
    required: true
    in_subset:
      - HashSubset
    description: >-
      What kind of constraint this RegistryRule expresses. Each declarative
      rule_type is atomic — one facet, one RegistryRule — so that a source
      setting only a lower bound doesn't imply anything about an upper
      bound, and a class-level refinement of MIN_VALUE doesn't sweep
      up MAX_VALUE (matching LinkML slot_usage, which refines facets
      independently). The constraint's parameter is carried on
      `rule_value` (a plain string) and interpreted per rule_type —
      see rule_value for the value grammar per enum entry. Facet
      variants that used to require a paired flag or language slot are
      encoded as separate enum values instead: strict bounds are
      MIN_VALUE_EXCLUSIVE / MAX_VALUE_EXCLUSIVE, and each supported
      expression language is its own EXPRESSION_* variant
      (EXPRESSION_SHACL, EXPRESSION_PYTHON, …). Identity-defining — a
      rule of type PATTERN with rule_value="^\\d+$" is a different RegistryRule
      from a rule of type EXPRESSION_PYTHON whose value happens to
      embed the same regex.

  applies_to:
    range: RegistryEntity
    multivalued: true
    required: true
    in_subset:
      - HashSubset
    # Multivalued so a rule that inspects several properties (a
    # cross-field validator) can name all of them. The *class scope*
    # of a class-level rule is NOT expressed here — it goes on the
    # separate `used_in_class` slot, which cleanly splits "what does
    # this rule constrain" (applies_to) from "in what class-scope does
    # it apply" (used_in_class).
    description: >-
      The registry entities this rule constrains — typically one
      RegistryProperty for a property-level constraint (a pattern on
      `identifier`, a min_length on `description`), or several
      RegistryProperty entities for a cross-field validator
      (dandi-schema's `@model_validator` for "identifier or url must be
      present" names both properties here). The class this rule is
      scoped to, if any, goes on `used_in_class`, not here — so
      applies_to stays purely about the constrained targets.
      Range is RegistryEntity for flexibility; ingestion should only
      ever populate this with RegistryClass or RegistryProperty
      targets (PermissibleValue, RegistryValueSet, RegistryRule itself are not valid
      targets).

  used_in_class:
    range: RegistryClass
    in_subset:
      - HashSubset
    # In the hash so a class-level refinement and the schema-level
    # default it overrides are distinct entities: unsetting used_in_class
    # from a RegistryRule and re-hashing would collapse the override into the
    # default, which is exactly the collision the override-resolution
    # rule is designed to keep separate.
    description: >-
      The RegistryClass this rule is scoped to, if any — populated for
      class-level refinements that ingest from LinkML `slot_usage`
      blocks (the slot name mirrors LinkML's own vocabulary) or the
      equivalent per-class overrides in other schema languages, and
      for standalone class-level constraints (cross-field validators,
      class invariants) that aren't slot refinements at all. Unset
      means the rule is a schema-level default: effective wherever
      `applies_to` matches. Set means the rule is effective *only*
      when the target property is used inside this class, and it
      overrides the schema-level rule of the same rule_type on the
      same applies_to property (rule_type-by-rule_type override,
      matching LinkML's slot_usage: refining PATTERN for a class does
      not drop the schema-level REQUIRED).
      Range is RegistryClass rather than RegistryEntity because a
      class-scope override is meaningful only against a class — a
      property doesn't have a "slot_usage" of its own.

  severity:
    range: RegistryRuleSeverityEnum
    ifabsent: 'ERROR'
    in_subset:
      - HashSubset
    # In the hash because a rule that fails-as-warning is a different
    # constraint from one that fails-as-error, even with identical
    # parameters: downstream validators treat them differently, and a
    # source that softened its own rule from ERROR to WARNING has issued a
    # different assertion.
    description: >-
      How a failure of this rule should be reported. Defaults to ERROR
      (the source-schema default: dandi-schema's Pydantic constraints and
      `@model_validator` bodies all raise). WARNING is for
      recommendation-style rules a source encodes but does not want to
      hard-fail on; INFO is for advisory/metadata rules used only to
      surface hints.

  error_message:
    range: string
    # Not in HashSubset — identity is the constraint, not the message the
    # source wrote next to it. Two ingestions of the same rule with
    # slightly different phrasing should collapse to one RegistryRule; a schema
    # editor tweaking the wording should not mint a new sha256_hash.
    description: >-
      Human-readable message describing what the rule requires, shown when
      it fails. Preserved verbatim from the source schema where one is
      supplied (dandi-schema's `ValueError` strings inside
      `@model_validator`, LinkML's `constraint_message`); otherwise
      populated by ingestion with a canned message derived from
      rule_type + parameters.

  rule_value:
    range: string
    in_subset:
      - HashSubset
    description: >-
      The constraint's parameter, as a string interpreted per
      `rule_type`. Everything the source declared collapses onto this
      one slot: a regex for PATTERN, a named format ("email", "uri",
      "uuid", …) for FORMAT, a numeric literal for
      MIN_VALUE / MIN_VALUE_EXCLUSIVE / MAX_VALUE / MAX_VALUE_EXCLUSIVE,
      an integer for MIN_LENGTH / MAX_LENGTH / MIN_CARDINALITY /
      MAX_CARDINALITY, "true"/"false" for REQUIRED / MULTIVALUED, an
      XSD CURIE or RegistryValueSet id for RANGE, a RegistryValueSet id for
      ENUM_MEMBERSHIP, a source-preserved default (LinkML `ifabsent`
      mini-expression, JSON Schema `default` as JSON text) for
      DEFAULT, and the whole validator body for the EXPRESSION_*
      variants. Kept as a plain string so LinkML slot_usage
      refinements are one-value swaps — no per-facet typed columns to
      migrate when a rule_type is added or changed. Downstream
      consumers parse rule_value per rule_type.

  referenced_entities:
    range: RegistryEntity
    multivalued: true
    in_subset:
      - HashSubset
    description: >-
      Additional entities an EXPRESSION_* rule mentions but does not
      apply to as its direct target — e.g. a dandi-schema
      `@model_validator` that reads `roleName` and `email` on
      Contributor would list Contributor in `applies_to` and both
      RegistryProperties here. Lets alignment find rules that touch a
      given property without conflating direct constraints with
      incidental references. Empty/omitted for the declarative
      rule_types.

  # --- SchemaSource / SchemaVersionSnapshot slots --------------------------

  attestations:
    range: ProvenanceEntry
    multivalued: true
    inverse: had_primary_source
    # Not in HashSubset — SchemaSource is not content-addressed. The
    # forward direction (ProvenanceEntry.had_primary_source) is the
    # authoritative edge; this slot names the inverse so LinkML
    # generators and RDF exports declare the round-trip. Whether the
    # graph writer also materializes a SchemaSource → ProvenanceEntry
    # column is an ingest choice — the underlying HAD_PRIMARY_SOURCE
    # edge is traversable both ways in the graph DB regardless.
    description: >-
      Every ProvenanceEntry that names this schema as its primary
      source. Inverse of ProvenanceEntry.had_primary_source, and the
      one-hop path for schema regeneration: starting from a
      SchemaSource, walk `attestations` and then each entry's
      `attests_to` to reach every registry entity the schema ever
      defined. Grows unbounded with ingest — implementations that
      export SchemaSource nodes standalone should page or omit this
      list rather than serializing thousands of ids into one field.

  label:
    range: string
    required: true
    description: Short identifier label for this schema source (e.g. "bids", "nwb").

  title:
    range: string
    description: >-
      Human-readable full name of the schema (e.g. "Brain Imaging Data
      Structure"), distinct from the short `label` used as its identifier.

  publisher:
    range: string
    description: Organization or group that maintains this schema.

  contact:
    range: string
    description: Contact point for this schema (person, mailing list, or URL).

  homepage:
    range: uri
    description: Documentation or landing page for this schema.

  part_of:
    range: SchemaBundle
    inverse: parts
    description: >-
      The SchemaBundle (logical schema) this source file belongs to, stored as
      an id FK. Every SchemaSource is part of exactly one bundle; a single-file
      schema's bundle has just this one part.

  parts:
    range: SchemaSource
    multivalued: true
    inverse: part_of
    description: >-
      The SchemaSource files that make up this bundle. Inverse of
      SchemaSource.part_of.

  license:
    range: string
    description: >-
      License of the schema, as an SPDX identifier or name (e.g. "CC-BY-4.0").

  source_iri:
    range: uriorcurie
    description: Canonical IRI for this schema source.

  source_id:
    range: uriorcurie
    description: >-
      The persistent IRI the source schema declared as its own `id:` (in
      LinkML: `schema.id`; the equivalent in other formats). Distinct from
      SchemaSource.id — that is the registry's internal UUID primary key,
      needed as a stable graph handle for FKs. `source_id` preserves the
      author's own identifier for the schema so a round-trip export can
      reconstruct `id:` losslessly.

  source_version:
    range: string
    description: >-
      Version of the source schema as declared by the source itself,
      never invented or bumped by the registry. On SchemaSource: the
      version at first ingestion (known frozen-value limitation). On
      ProvenanceEntry: the source's version at the time of this
      attestation — this is what lets a query scope entities and
      mappings to "BIDS 1.9 specifically", lets re-ingestion diff by
      version, and makes an alignment run's inputs statable, without
      needing SchemaVersionSnapshot.

  mime_type:
    range: string
    description: MIME type of the schema file (e.g. "application/yaml").

  content_hash:
    range: string
    description: >-
      SHA-256 of the schema source's canonicalised raw text — a file-level
      fingerprint used to detect (and reject) a schema whose exact content is
      already in the registry before re-ingesting it. Distinct from the
      per-entity sha256_hash on RegistryClass/RegistryProperty.

  created_at:
    range: datetime
    description: ISO-8601 timestamp when this record was created.

  schema_label:
    range: string
    required: true
    description: Label of the schema this snapshot belongs to (FK to SchemaSource.label).

  yml_path:
    range: string
    description: Relative path to the schema YAML file at snapshot time.

  class_count:
    range: integer
    description: Number of classes in the schema at this version.

  property_count:
    range: integer
    description: Number of properties in the schema at this version.

  changes_summary:
    range: string
    description: Human-readable summary of what changed in this version.

  # --- RegistrySchema slots --------------------------------------------------

  namespace_iri:
    range: uriorcurie
    required: true
    description: >-
      Base namespace for this schema — becomes its own `id:` when exported
      to LinkML (or the equivalent namespace declaration in another output
      format).

  default_range:
    range: string
    description: >-
      Default range for slots that don't declare one explicitly, carried
      into the exported schema's `default_range:`. Optional — a composed
      schema may give every property an explicit RANGE rule and not need
      a default.

  imports:
    range: string
    multivalued: true
    description: >-
      Import statements to carry into the exported schema verbatim (e.g.
      "linkml:types"). Not resolved or validated by the registry — passed
      through as-is.

  registry_classes:
    range: RegistryClass
    multivalued: true
    description: The RegistryClass entities (by id) included in this schema.

  registry_properties:
    range: RegistryProperty
    multivalued: true
    description: >-
      The RegistryProperty entities (by id) included in this schema.
      Not implied by registry_classes' own `properties` — a composed
      schema may include a standalone property not attached to any
      included class, or omit one of an included class's properties.

  registry_rules:
    range: RegistryRule
    multivalued: true
    description: The RegistryRule entities (by id) included in this schema.

  registry_value_sets:
    range: RegistryValueSet
    multivalued: true
    description: The RegistryValueSet entities (by id) included in this schema.

  created_by:
    range: string
    description: Agent (user or system) that composed this schema.

  # --- PermissibleValue / RegistryValueSet slots ------------------------------------

  meaning:
    range: uriorcurie
    in_subset:
      - HashSubset
    description: >-
      Ontology IRI this permissible value maps to (e.g. skos:exactMatch
      for the EXACT_MATCH value in SkosMappingTypeEnum).

  permissible_values:
    range: PermissibleValue
    multivalued: true
    in_subset:
      - HashSubset
    description: >-
      The set of permissible values for this RegistryValueSet. Stored as id
      references; HAS_PERMISSIBLE_VALUE edges are the graph traversal.

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

enums:

  SkosMappingTypeEnum:
    description: The kind of SKOS mapping relation between a registry entity and an external concept.
    permissible_values:
      EXACT_MATCH:
        meaning: skos:exactMatch
        description: The registry entity is equivalent to the external concept.
      CLOSE_MATCH:
        meaning: skos:closeMatch
        description: The registry entity is sufficiently similar to the external concept.
      BROAD_MATCH:
        meaning: skos:broadMatch
        description: The external concept is broader than the registry entity.
      NARROW_MATCH:
        meaning: skos:narrowMatch
        description: The external concept is narrower than the registry entity.
      RELATED_MATCH:
        meaning: skos:relatedMatch
        description: The registry entity is related to the external concept.
      EQUIVALENT_CLASS:
        meaning: owl:equivalentClass
        description: >-
          Strict logical equivalence. Exclusively human-issued and used
          sparingly: it is the one predicate the alignment pipeline's
          reasoner-based repair pass may treat as OWL equivalence, so it
          must never be machine-assigned.

  ReviewStatusEnum:
    description: Curation lifecycle of a Mapping.
    permissible_values:
      PROPOSED:
        description: Machine- or human-proposed; not yet reviewed.
      ACCEPTED:
        description: Validated by a reviewer; safe for high-rigor queries.
      REJECTED:
        description: Reviewed and refuted; retained as negative evidence.
      SUPERSEDED:
        description: Replaced by a newer mapping.

  RegistryRuleTypeEnum:
    description: >-
      The kind of constraint a RegistryRule expresses. `rule_value` (a plain
      string) carries the constraint's parameter, interpreted per
      rule_type — the grammar for each entry is given below. The
      declarative types are per-facet and atomic (one RegistryRule per facet)
      so cross-schema alignment and class-level slot_usage refinement
      both work facet-by-facet without the redundant restatement a
      bundled type would force. Facet variants that used to require a
      paired flag or language slot are encoded here as separate enum
      values instead (MIN_VALUE_EXCLUSIVE, EXPRESSION_SHACL, …), so
      the whole model reads as `rule_type + rule_value + applies_to +
      used_in_class`.
    permissible_values:
      PATTERN:
        description: >-
          Value must match a regex. `rule_value` is the pattern,
          preserved verbatim from the source (dandi-schema
          `Field(pattern=NAME_PATTERN)`, LinkML `pattern:`, JSON
          Schema `"pattern"`).
      FORMAT:
        description: >-
          Value must satisfy a named semantic format. `rule_value` is
          the format keyword ("email", "uri", "uuid", "date-time",
          "ipv4", …). Distinct from PATTERN so two schemas both
          declaring `"format": "email"` collapse to the same RegistryRule
          even if their fallback regex enforcement differs.
      MIN_VALUE:
        description: >-
          Numeric value must satisfy a lower bound (inclusive).
          `rule_value` is the bound as a decimal string. A schema
          stating only a lower bound produces just this RegistryRule.
      MIN_VALUE_EXCLUSIVE:
        description: >-
          Numeric value must satisfy a strict lower bound (value >
          rule_value rather than value >= rule_value). Separate enum
          value rather than a paired `exclusive_minimum` flag so
          "strict lower bound" reads as one atomic constraint.
      MAX_VALUE:
        description: >-
          Numeric value must satisfy an upper bound (inclusive).
          `rule_value` is the bound as a decimal string.
      MAX_VALUE_EXCLUSIVE:
        description: >-
          Numeric value must satisfy a strict upper bound
          (value < rule_value rather than value <= rule_value).
      MIN_LENGTH:
        description: >-
          String length must satisfy a lower bound. `rule_value` is
          the bound as an integer string. Distinct from
          MIN_CARDINALITY so string-character and list-item bounds
          never hash to the same RegistryRule.
      MAX_LENGTH:
        description: >-
          String length must satisfy an upper bound. `rule_value` is
          the bound as an integer string (dandi-schema's
          `Field(max_length=10000)` on `description`).
      MIN_CARDINALITY:
        description: >-
          Multivalued property must carry at least `rule_value` items.
          Distinct from MIN_LENGTH to keep list-count and
          string-length constraints separable.
      MAX_CARDINALITY:
        description: >-
          Multivalued property must carry at most `rule_value` items.
          Exact-one is enforced as MIN_CARDINALITY=1 plus
          MAX_CARDINALITY=1, two RegistryRules — dandi-schema
          `List[AccessRequirements] = Field(max_length=1)`.
      REQUIRED:
        description: >-
          Property must be present. `rule_value` is "true" or "false"
          — "false" explicitly asserts optional (some sources state
          this).
      MULTIVALUED:
        description: >-
          Property may (`rule_value` = "true") or may not
          (`rule_value` = "false") carry multiple values.
      RANGE:
        description: >-
          One permitted value type for the property in a given usage.
          `rule_value` is an XSD CURIE (e.g. "xsd:integer") for a primitive,
          or a RegistryClass / RegistryValueSet id for an entity/enum
          reference. This is where a property's type lives — it is NOT part of
          RegistryProperty identity (a property is a "pure concept"), so the
          same property collapses across schemas even when one types it
          integer and another string, and each source's choice is its own
          RANGE rule. A union / polymorphic property (LinkML `any_of`, JSON
          Schema `anyOf`) simply produces several RANGE rules — one per
          permitted type, each an atomic assertion that collapses across
          schemas independently, just as MIN_VALUE and MAX_VALUE are separate
          rules. A rule with `used_in_class` unset is the schema-level range;
          with `used_in_class` set it is a per-class narrowing (LinkML
          `slot_usage` range refinement, JSON Schema `if/then` type switches).
      UNIT:
        description: >-
          The unit of measure for the property's values in a given usage.
          `rule_value` is the UCUM code (e.g. "a" for years, "mo" for months,
          "mV", "Hz"). Like RANGE, unit is a realization detail, not part of
          RegistryProperty identity — so "age in full years" and "age in full
          months" are the same concept, and each source's unit is its own UNIT
          rule. This is what lets alignment's unit veto compare units
          per-source without the property splitting on unit.
      ENUM_MEMBERSHIP:
        description: >-
          Value must be drawn from a RegistryValueSet. `rule_value` is the
          RegistryValueSet's id. Distinct from a RANGE rule that names a
          RegistryValueSet — that is a type declaration; this is the
          enforceable check.
      DEFAULT:
        description: >-
          Property takes `rule_value` when absent. A "fill-in" rule,
          not a validator — retained in RegistryRuleTypeEnum because sources
          declare defaults alongside constraints (LinkML `ifabsent`,
          JSON Schema `default`, Pydantic `Field(default=...)`) and
          consumers read them from the same RegistryRule graph. `rule_value`
          preserves the source form verbatim; downstream tools parse
          per-source (LinkML `ifabsent` mini-expressions, JSON default
          as JSON text).
      EXPRESSION_SHACL:
        description: >-
          W3C SHACL shape body (Turtle or JSON-LD). `rule_value` is
          the shape source, preserved verbatim. Registry does not
          currently execute these.
      EXPRESSION_SHEX:
        description: ShEx shape expression. `rule_value` is the shape source.
      EXPRESSION_JSON_SCHEMA:
        description: >-
          JSON Schema fragment — typically the `if/then/else` or
          `allOf`/`anyOf`/`oneOf` composition that could not be
          expressed as a declarative rule_type. `rule_value` is the
          JSON Schema source.
      EXPRESSION_SPARQL_ASK:
        description: >-
          SPARQL ASK query. `rule_value` is the query text; the
          constraint holds iff the query returns true.
      EXPRESSION_PYTHON:
        description: >-
          Python source (dandi-schema `@model_validator` bodies,
          Pydantic `@field_validator` bodies). `rule_value` is the
          function body, preserved for record only — the registry
          does not execute these.
      EXPRESSION_LINKML_RULES:
        description: >-
          A LinkML `rules:` block (preconditions/postconditions in
          LinkML's own rule language). `rule_value` is the rules-block
          source.
      EXPRESSION_PLAIN_TEXT:
        description: >-
          Natural-language description — the source stated a
          constraint prose-only, with no machine-checkable form.
          `rule_value` is the prose.

  RegistryRuleSeverityEnum:
    description: >-
      How a RegistryRule failure is to be reported by a downstream validator.
      Mirrors SHACL's sh:severity levels; a source schema that does not
      state a severity ingests as ERROR (see RegistryRule.severity ifabsent).
    permissible_values:
      ERROR:
        meaning: sh:Violation
        description: Failure is a hard violation.
      WARNING:
        meaning: sh:Warning
        description: >-
          Failure is a recommendation the source encodes but does not
          hard-fail on.
      INFO:
        meaning: sh:Info
        description: Failure is advisory only — a hint, not a defect.

